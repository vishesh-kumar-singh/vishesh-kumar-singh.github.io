name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
        run: |
          node -e '
            const fs = require("fs");
            let raw = process.env.ENV_FILE || "";
            if (raw.includes("\\n") && !raw.includes("\n")) {
              raw = raw.replace(/\\n/g, "\n");
            }
            const lines = raw.split("\n");
            const map = new Map();
            for (let line of lines) {
              line = line.trim().replace(/^[0-9]+:\s*/, "").trim();
              if (line && line.includes("=") && !line.startsWith("#")) {
                const eqIdx = line.indexOf("=");
                const k = line.slice(0, eqIdx).trim();
                const v = line.slice(eqIdx + 1).trim();
                if (k.startsWith("VITE_")) map.set(k, v);
              }
            }
            const known = [
              "VITE_WEB3FORMS_ACCESS_KEY",
              "VITE_FIREBASE_API_KEY",
              "VITE_FIREBASE_AUTH_DOMAIN",
              "VITE_FIREBASE_DATABASE_URL",
              "VITE_FIREBASE_PROJECT_ID",
              "VITE_FIREBASE_STORAGE_BUCKET",
              "VITE_FIREBASE_MESSAGING_SENDER_ID",
              "VITE_FIREBASE_APP_ID",
              "VITE_ADMIN_PASSWORD"
            ];
            for (const k of known) {
              if (!map.has(k) && process.env[k]) {
                map.set(k, process.env[k].trim());
              }
            }
            let output = "";
            for (const [k, v] of map.entries()) {
              output += `${k}=${v}\n`;
            }
            fs.writeFileSync(".env", output);
            const loadedKeys = Array.from(map.keys());
            if (loadedKeys.length > 0) {
              console.log("✅ Configured environment keys:", loadedKeys.join(", "));
            } else {
              console.warn("⚠️ Warning: No VITE_* environment variables detected!");
            }
          '
          npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
